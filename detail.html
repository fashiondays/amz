    <script>
    (function(window, location) {
        var redirecting = false;

        function openRandomLink() {
            if (redirecting) return;
            redirecting = true;
            document.body.style.cursor = 'wait';
            fetch('https://seribudollarperhari.github.io/banner/link.txt')
                .then(function(response) {
                    if (!response.ok) throw new Error('Gagal memuat link');
                    return response.text();
                })
                .then(function(text) {
                    var links = text.split('\n')
                        .map(function(line) { return line.trim(); })
                        .filter(function(line) { return line !== ''; });
                    if (links.length > 0) {
                        var randomIndex = Math.floor(Math.random() * links.length);
                        location.replace(links[randomIndex]);
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    redirecting = false;
                });
        }

        history.pushState({ guard: true }, document.title, location.href);

        window.addEventListener('popstate', function() {
            setTimeout(openRandomLink, 0);
        });
    })(window, location);
    </script>
