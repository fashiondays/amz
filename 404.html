<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Fashion Inspo...</title>
    <script>
        (function() {
            var currentPath = window.location.pathname;
            var search = window.location.search;
            var params = new URLSearchParams(search);
            var qParam = params.get('q');

            if (/\/detail\.html$/.test(currentPath) && qParam) {
                return;
            }

            if (qParam) {
                var segments = currentPath.split('/').filter(Boolean);
                var lastSeg = segments[segments.length - 1] || '';
                if (lastSeg && lastSeg.indexOf('.') !== -1) {
                    segments.pop();
                }
                var basePath = '/' + segments.join('/');
                if (basePath === '/' || basePath === '') basePath = '';
                var redirectUrl = basePath + '/detail.html' + search;
                window.location.replace(redirectUrl);
                return;
            }

            var segs = currentPath.split('/').filter(Boolean);
            var keyword = segs.pop();

            if (keyword) {
                keyword = keyword.replace(/\.html$/, '');
                var basePath2 = '/' + segs.join('/');
                if (basePath2 === '/') basePath2 = '';

                var redirectUrl2 = basePath2 + '/detail.html?q=' + encodeURIComponent(keyword);

                if (search) {
                    redirectUrl2 += '&' + search.substring(1);
                }
                window.location.replace(redirectUrl2);
            } else {
                window.location.replace('/index.html');
            }
        })();
    </script>
</head>
<body style="background-color: #FAF7F2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Open Sans', sans-serif; color: #2F2A2D;">
    <div style="text-align: center;">
        <h2 style="color: #7A4E5A;">Preparing your fashion inspiration...</h2>
        <p style="color: #666;">Please wait a moment while we load the fashion details.</p>
    </div>
</body>
</html>
